name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The core patcher is pure stdlib; keystone (mkmod assembler test) and
      # capstone (re.switches census test) are only for those tests. The
      # firmware-dependent suites never run here -- the stock .bin is never committed.
      - name: Install keystone + capstone (assembler and switch-census tests)
        run: pip install keystone-engine==0.9.2 capstone==5.0.7

      - name: Firmware-free test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Site builds (engine zip + catalog)
        run: python site/make_site.py

      # The mod shop's JavaScript (site/shop): the USB protocol against a pretend core, every catalog file by its
      # sha256 and header, the .m8t file, and the page's colours in each preset theme.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mod shop
        run: node tests/test_shop.mjs
      - name: Mod shop firmware build and USB flasher
        run: node tests/test_firmware.mjs
